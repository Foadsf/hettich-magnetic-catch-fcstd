# Build the .FCStd from the hand-written XML, verify it in FreeCAD, export the TechDraw
# drawing and 3D views, and publish everything generated as release assets.
# Nothing generated is committed: every file below lands in dist/ and ships on a tag.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release on a tag

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash -el {0}   # login shell so the micromamba environment is active
    env:
      NAME: Hettich_MagneticCatch_5kg
    steps:
      - uses: actions/checkout@v7

      - name: FreeCAD 1.0 from conda-forge
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: freecad
          create-args: >-
            python=3.11
            freecad=1.0
            ezdxf
            matplotlib
          cache-environment: true

      - name: X server, OpenGL and PDF rasteriser
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb xauth libgl1-mesa-dri libglx-mesa0 poppler-utils
          freecadcmd --version || true

      - name: Tool self-test (includes negative controls)
        run: python tools/fcstd_xml.py --selftest

      - name: Lint the hand-written XML and pack the .FCStd
        run: |
          mkdir -p dist
          python tools/fcstd_xml.py lint src
          python tools/fcstd_xml.py pack src "dist/$NAME.FCStd"

      - name: Verify geometry, assembly and parameters; export STEP
        run: >-
          python tools/fcstd_xml.py verify "dist/$NAME.FCStd"
          --edit DoorGap=5 --edit HoleDia=4 --edit HsgLength=50
          --step "dist/$NAME.step" --timeout 600

      # TechDraw needs the GUI event loop. Xvfb is a real X display; Qt's "offscreen"
      # platform is not usable here (its page exports lose the template and dimensions).
      - name: Open in the FreeCAD GUI; export TechDraw DXF/PDF/SVG and 3D views
        run: >-
          xvfb-run -a -s "-screen 0 1920x1200x24"
          python tools/fcstd_xml.py gui "dist/$NAME.FCStd" --out dist
          --edit HsgLength=50 --edit SlotPitch=40 --timeout 900

      - name: Check the DXF and rasterise previews
        run: |
          python tools/fcstd_xml.py dxf "dist/${NAME}_Page.dxf" --png "dist/${NAME}_Page_dxf.png"
          pdftoppm -png -r 150 -singlefile "dist/${NAME}_Page.pdf" "dist/${NAME}_Page"
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: hettich-magnetic-catch
          path: dist/
          if-no-files-found: error

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
